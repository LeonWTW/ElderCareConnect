services:
  backend:
    build: ./source/backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - eldercare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eldercare_pg:
