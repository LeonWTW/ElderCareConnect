services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eldercare
      - POSTGRES_PASSWORD=eldercare
      - POSTGRES_DB=eldercare
    volumes:
      - eldercare_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldercare"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./source/backend
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=eldercare
      - PGPASSWORD=eldercare
      - PGDATABASE=eldercare
    volumes:
      - ./source/backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./source/frontend:/usr/share/nginx/html:ro

volumes:
  eldercare_db:
