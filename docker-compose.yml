services:
  backend:
    build: ./source/backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./source/backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./source/frontend:/usr/share/nginx/html:ro
