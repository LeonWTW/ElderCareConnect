services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eldercare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eldercare_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./source/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eldercare
      JWT_SECRET: change-me-in-real-life
      JWT_EXPIRES_SECONDS: "86400"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  eldercare_pg:
