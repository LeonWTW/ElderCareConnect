services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eldercare
      - POSTGRES_PASSWORD=eldercare
      - POSTGRES_DB=eldercare
    volumes:
      - eldercare_db:/var/lib/postgresql/data

  backend:
    build: ./source/backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=eldercare
      - PGPASSWORD=eldercare
      - PGDATABASE=eldercare
    volumes:
      - ./source/backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./source/frontend:/usr/share/nginx/html:ro

volumes:
  eldercare_db:
