<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Connect - Home</title>
    <link rel="stylesheet" href="styles/caregiver_home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/caregiver_home.js" defer></script>
</head>

<body>

    <header>
        <nav class="navbar">
           <button class="logout" id="logoutBtn">Log Out</button>
        </nav>
    </header>

    <main>
        <div id="content" class="content">
            <h2 class="label">Caregiver Dashboard</h2>
            <p class="desc">Welcome! Manage tasks and monitor here!</p>
        </div>

        <div id="tasks" class="tasks hidden">
            <h2>Test</h2>
            
        </div>

        <div id="notifs" class="notifs hidden">
            <h2>Test</h2>
        </div>

    </main>

    <footer class="footer-nav">
        
        <nav class="footer-navbar">
            <button class="footer-button" id="tasksBtn"><i class="fas fa-list-check"></i> Manage Tasks</button>
            <button class="footer-button" id="monitorBtn"><i class="fa-solid fa-computer"></i> Notifications</button>
        </nav>
    </footer>

</body>
