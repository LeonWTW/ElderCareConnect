<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Connect - Home</title>
    <link rel="stylesheet" href="styles/caregiver_home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/caregiver_home.js" defer></script>
</head>

<body>

    <header>
        <nav class="navbar">
           <button class="logout" id="logoutBtn">Log Out</button>
        </nav>
    </header>

    <main>
        <div id="content" class="content">
            <h2 id="dashboardLabel" class="label"></h2> <!-- Name on dashboard -->
            <p class="desc">Welcome! Manage tasks and monitor here!</p>
        </div>

        <div id="tasks" class="tasks hidden">
            <h2 class="tasks-label">Task Management</h2>
            
            <div class="elderSelect">
                <select id="elderSelect" required>
                    <option value="">Select Elder to Manage</option>
                    <option value="">Tester</option>
                </select>
            </div>

            <div class="tasks-container">
                <!-- Add Tasks Box -->
                <div class="task-box">
                    <h3>Add New Task</h3>
                    <form id="addTaskForm" class="task-form">
                        <input type="text" id="taskInput" placeholder="Enter task description" required>
                        <textarea id="taskDetails" placeholder="Task details (optional)" rows="4"></textarea>
                        <button type="submit" class="submit-btn">Add Task</button>
                    </form>
                </div>
                
                <!-- Tasks Box -->
                <div class="task-box">
                    <h3>Tasks</h3>
                    <div id="TasksList" class="-tasks-list">
                        <p class="empty-message">No tasks yet</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- TODO: replace placeholder notifications -->
        <div id="notifs" class="notifs hidden">
            <h2 class="notifs-label">Notifications</h2>
            <div class="notification-list">
                <div class="notification-box">
                    <h3>Elder Name</h3>
                    <p>Just checked in</p>
                    <span class="time">2 minutes ago</span>
                </div>
                <!-- <div class="notification-box">
                    <h3>Elder Name</h3>
                    <p>Completed task: Take medication</p>
                    <span class="time">15 minutes ago</span>
                </div>
                <div class="notification-box">
                    <h3>Elder Name</h3>
                    <p>Just checked in</p>
                    <span class="time">2 minutes ago</span>
                </div>
                <div class="notification-box">
                    <h3>Elder Name</h3>
                    <p>Completed task: Take medication</p>
                    <span class="time">15 minutes ago</span> -->
                </div>
            </div>
        </div>

    </main>

    <footer class="footer-nav">
        
        <nav class="footer-navbar">
            <button class="footer-button" id="homeBtn"><i class="fas fa-list-check"></i> Home</button>
            <button class="footer-button" id="tasksBtn"><i class="fas fa-list-check"></i> Manage Tasks</button>
            <button class="footer-button" id="monitorBtn"><i class="fa-solid fa-computer"></i> Notifications</button>
        </nav>
    </footer>

</body>
