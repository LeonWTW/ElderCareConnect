<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Connect - Home</title>
    <link rel="stylesheet" href="styles/caregiver_home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/caregiver_home.js" defer></script>
</head>

<body>

    <main>
        <div class="dashboard">
            <h2 class="label">Caregiver Dashboard</h2>
            <p class="desc">Welcome! Manage tasks and monitor here!</p>

            <div class="dashboard-grid">
                <button class="button" id="tasksBtn"><i class="fas fa-list-check"></i> Manage Tasks</button>
                <button class="button" id="monitorBtn"><i class="fa-solid fa-computer"></i> Notifications</button>
            </div>

            <button class="logout" id="logoutBtn">Log Out</button>
        </div>
    </main>

</body>
