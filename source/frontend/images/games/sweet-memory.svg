<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#FF9090"/>

  <!-- Card deck area -->
  <rect x="60" y="50" width="280" height="200" rx="12" fill="#FFFA62" stroke="#000" stroke-width="3"/>

  <!-- Card 1 (face up, matched - green) -->
  <rect x="80" y="70" width="70" height="70" rx="8" fill="#9BCB3C"/>
  <text x="115" y="113" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">⚓</text>

  <!-- Card 2 (face up, matched - green) -->
  <rect x="165" y="70" width="70" height="70" rx="8" fill="#9BCB3C"/>
  <text x="200" y="113" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">⚓</text>

  <!-- Card 3 (face down - orange) -->
  <rect x="250" y="70" width="70" height="70" rx="8" fill="#FFCF7F"/>
  <text x="285" y="113" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">?</text>

  <!-- Card 4 (face down - orange) -->
  <rect x="80" y="155" width="70" height="70" rx="8" fill="#FFCF7F"/>
  <text x="115" y="199" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">?</text>

  <!-- Card 5 (face up, open - blue) -->
  <rect x="165" y="155" width="70" height="70" rx="8" fill="#89C4FF"/>
  <text x="200" y="199" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">⚡</text>

  <!-- Card 6 (face down - orange) -->
  <rect x="250" y="155" width="70" height="70" rx="8" fill="#FFCF7F"/>
  <text x="285" y="199" text-anchor="middle" font-size="28" fill="#fff" font-family="sans-serif">?</text>

  <!-- Title -->
  <text x="200" y="278" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff" font-family="system-ui, sans-serif" stroke="#000" stroke-width="0.5">Sweet Memory</text>
</svg>
