<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Connect - Home</title>
    <link rel="stylesheet" href="styles/elder_home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/elder_home.js" defer></script>
</head>

<body>

    <main>
        <h2 id="success" class="checkedin hidden">You've checked in! We'll notify your caregiver shortly.</h2>
        <h2 id="games" class="games hidden">Work in progress. Check back later.</h2>
        <div class="dashboard">
            <h2 class="label">Elder Dashboard</h2>
            <p class="desc">Welcome! Remember to always check in and view tasks!</p>

            <div class="dashboard-grid">
                <button class="button" id="tasksBtn"><i class="fas fa-list-check"></i> View Tasks</button>
                <button class="button" id="checkinBtn"><i class="fas fa-check-circle"></i> Check In</button>
                <button class="button" id="gamesBtn"><i class="fas fa-x"></i> Play Games</button>
            </div>

            <button class="logout" id="logoutBtn">Log Out</button>
        </div>
    </main>

</body>
