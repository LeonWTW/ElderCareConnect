<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Connect - Login</title>
    <link rel="stylesheet" href="styles/elder_login.css">
    <script src="scripts/elder_login.js" defer></script>
</head>


<body> 

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="login_redirect.html" class="nav-logo"> 
                Back to login selection
            </a>
        </nav>
    </header>

    <div class="log-in-box">
        <div id="login">
            <h1 class="label">Elder Login</h1>
            <div class="username">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="caregiver-name">
                <label for="caregiver_name">Caregiver Name</label>
                <input type="text" id="caregiver" name="caregiver_name">
            </div>

            <div class="elder-pin">
                <label for="elder_pin">PIN</label>
                <input type="password" id="pin" name="elder_pin" inputmode="numeric" maxlength="4" placeholder="4-digit PIN">
            </div>

            <button id="submitBtn">Log In</button>
            <button id="forgotPinBtn" type="button">Forgot PIN</button>
            
            <p id="message"></p>
        </div>
    </div>
</body>
